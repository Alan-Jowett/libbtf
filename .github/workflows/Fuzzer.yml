# Linux only.

name: Fuzzer

on:
  workflow_dispatch:
  schedule:
    - cron: '00 21 * * *'

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-22.04
    env:
      BUILD_TYPE: Debug

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: 'recursive'

    - name: Configure CMake
      run: |
        cmake \
          -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DBTF_ENABLE_FUZZING=TRUE

    - name: Build only libbtf_fuzzer
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build

    - name: Tests
      working-directory: ${{github.workspace}}
      run: |
        mkdir -p Artifacts
        build/libfuzzer/libbtf_fuzzer build/libfuzzer/corpus -use_value_profile=1 -max_total_time=300 -artifact_prefix=Artifacts/

    - name: Check for generated artifacts
      # Check for artifacts even if the workflow failed.
      if: success() || failure()
      uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029
      id: check_artifacts
      with:
        files: ${{github.workspace}}/Artifacts/*

    - name: Upload generated artifacts
      # Upload artifacts even if the workflow failed.
      if: success() || failure()
      id: upload_artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: Libfuzzer artifacts
        path: ${{github.workspace}}/Artifacts/
        retention-days: 5
